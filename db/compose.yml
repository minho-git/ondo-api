# 로컬 개발용 PostgreSQL 두 대. 도매 / 소매
# 배포용 아님 — 비밀번호가 그대로 적혀 있다.
#
#   docker compose -f db/compose.yml up -d      DB 두 대 띄우기
#   docker compose -f db/compose.yml down       내리기 (데이터는 남는다)
#   docker compose -f db/compose.yml down -v    데이터까지 지우기
#
# 스키마는 여기서 안 넣는다. 각 앱이 뜰 때 자기 마이그레이션을 돌린다
#   wholesale-api/src/main/resources/db/migration/
#   retail-api/src/main/resources/db/migration/

name: ondo

services:
  wholesale-db:
    image: postgres:16          # 버전을 못 박는다. 팀과 같은 걸 써야 한다
    container_name: ondo-wholesale-db
    # 공유 메모리. 도커 기본값 64MB 로는 병렬 쿼리가 몰리면 PostgreSQL 이
    # "could not resize shared memory segment: No space left on device" 로 쿼리를 실패시킨다.
    # 상품 10만 건 부하 테스트에서 소매접점 상품 목록이 71% 실패했다(MUL-118).
    # RDS 에는 없는 제약이라 로컬 결과가 운영과 달라진다 — 늘려서 맞춘다
    shm_size: 1g
    environment:
      POSTGRES_DB: ondo_wholesale
      POSTGRES_USER: ondo
      POSTGRES_PASSWORD: ondo
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - wholesale-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondo -d ondo_wholesale"]
      interval: 5s
      timeout: 3s
      retries: 10

  retail-db:
    image: postgres:16
    container_name: ondo-retail-db
    shm_size: 1g                # 도매와 같은 이유
    environment:
      POSTGRES_DB: ondo_retail
      POSTGRES_USER: ondo
      POSTGRES_PASSWORD: ondo
      TZ: Asia/Seoul
    ports:
      - "5433:5432"             # 5432 는 도매가 쓴다
    volumes:
      - retail-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondo -d ondo_retail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wholesale-pgdata:
  retail-pgdata:
