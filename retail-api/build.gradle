plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ondo'
version = '0.0.1-SNAPSHOT'
description = 'On도마켓 소매 API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 헬스체크(MUL-76). ALB 가 30초마다 불러서 태스크가 살아있는지 본다
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

	// 가입 서류를 S3 에 올린다 (MUL-100). 배포 프로필에서만 쓰인다 —
	// 로컬은 LocalFileStorage 로 디스크에 쓰므로 AWS 없이 돌아간다.
	//
	// BOM 으로 버전을 맞춘다. SDK 모듈이 서로 버전이 어긋나면 런타임에 터진다
	implementation platform('software.amazon.awssdk:bom:2.46.7')
	implementation 'software.amazon.awssdk:s3'
	// 자바독을 그대로 API 문서 설명으로 쓴다. 주석과 문서가 따로 놀지 않게 하려는 것이다.
	implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'
	annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()

	// 테스트 JVM 을 KST 로 고정한다 (MUL-105).
	//
	// 도매에서 실제로 터졌던 것을 소매에도 미리 막는다. 기간 필터는 한국 날짜를
	// 전제하는데 테스트가 LocalDate.now() 를 쓰면 JVM 기본 시간대를 따라가서,
	// 둘이 어긋나는 환경에서만 깨진다. 팀 노트북은 전부 KST 라 안 보이고
	// GitHub 러너는 UTC 다 — UTC 로 15시가 넘으면 한국은 이미 다음 날이다.
	//
	// db/compose.yml 이 TZ: Asia/Seoul 로 맞춰 둔 것과 같은 이유다
	systemProperty 'user.timezone', 'Asia/Seoul'
}
