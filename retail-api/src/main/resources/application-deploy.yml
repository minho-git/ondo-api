# 배포 공통 (MUL-104).
#
# dev · prod 둘 다 읽는다. 두 파일에 같은 줄을 두 벌 두지 않으려고 뺐다.
#
# 이 파일은 직접 켜지 않는다. application.yml 의 프로필 그룹이 dev · prod 에
# 붙여준다 — ECS 는 SPRING_PROFILES_ACTIVE 에 dev 나 prod 하나만 주면 된다.
#
# 로컬은 안 읽는다. 여기 있는 건 전부 환경변수를 요구하는 값이라
# 로컬에서 읽히면 앱이 안 뜬다. 그래서 application.yml 에 못 둔다.
#
# 비밀은 이 파일에 적지 않는다. ECS 태스크가 뜰 때 Secrets Manager 에서 받아
# 환경변수로 넣어주고, 스프링이 ${} 자리에 끼운다. 이미지에도 코드에도 값이 없다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # ALB 가 앞에 있다. 앱이 보는 요청은 ALB 가 내부로 전달한 것이라 주소가 다르다 —
  # 그대로 두면 스프링이 자기를 http://10.0.x.x:8080 인 줄 안다.
  #
  # 그러면 문서(MUL-110)의 servers 에 그 내부 주소가 박혀서, 스칼라의 테스트 버튼이
  # 브라우저에서 닿지도 않는 곳을 부른다. 리다이렉트도 http 로 나간다.
  #
  # ALB 가 X-Forwarded-Proto · X-Forwarded-Host 를 붙여준다. 이 설정이 그걸 읽게 한다.
  # 값을 믿어도 되는 건 ALB 가 클라이언트가 보낸 것을 덮어쓰기 때문이다.
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true   # 배포는 https 다. 이걸 안 켜면 쿠키가 http 로도 나간다

# 소매 화면의 교차 출처 호출 허용 (MUL-85).
#
# 값을 환경변수로 뺀 건 환경이 둘이기 때문이다 — 개발과 운영이 허용할 주소가
# 다르다. 파일에 박아두면 같은 이미지를 두 환경에 못 쓴다. DB 주소와 같은 이유다.
#
# 끝의 `:` 는 "안 주면 빈 값" 이다. 안 붙이면 환경변수를 빠뜨렸을 때 앱이 기동조차
# 못 한다. 빈 값이면 허용 origin 이 없어 교차 출처가 전부 막힐 뿐이고,
# 헬스체크와 서버 간 호출은 그대로 된다 — 실수했을 때 닫히는 쪽으로 넘어진다.
ondo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # 가입 서류를 둘 S3 버킷 (MUL-100).
  #
  # 로컬은 이 설정을 안 읽는다 — LocalFileStorage 가 디스크에 쓰고, S3 쪽 빈은
  # @Profile("deploy") 라 아예 안 뜬다. 팀원이 AWS 없이 돌릴 수 있어야 한다.
  #
  # 끝에 `:` 를 안 붙였다. 게이트웨이 시크릿과 같은 판단이다 — 값이 없으면 기동을
  # 실패시킨다. 빈 값으로 뜨면 가입 API 는 200 을 주는데 서류만 조용히 안 올라간다.
  # 그건 사람이 한참 뒤에나 알아채고, 그때는 이미 서류가 유실된 뒤다.
  # 기동에 실패하면 배포 회로차단기가 이전 태스크로 되돌린다.
  #
  # ⚠️ 환경변수 이름과 프로퍼티 이름은 자동으로 안 맞는다. 이 줄이 그 둘을 잇는다 —
  #    도매 CORS 가 한동안 무시됐던 게 이 줄이 없어서였다(MUL-103).
  storage:
    s3:
      bucket: ${DOCUMENTS_BUCKET}

      # 리전을 명시한다. SDK 가 환경에서 알아내기도 하지만 ECS 가 늘 넣어주는 값이
      # 아니고, 못 찾으면 기동이 아니라 첫 업로드에서 터진다.
      # 기본값을 둔 건 리전이 바뀔 일이 없어서다 — 바뀌면 요청이 시끄럽게 실패한다
      region: ${AWS_REGION:ap-northeast-2}

  # 도매 서버 주소 (MUL-88). 내부 ALB 다 (MUL-87).
  #
  # 끝의 `:` 는 CORS 와 같은 이유다. 안 붙이면 환경변수가 없을 때 앱이 기동조차
  # 못 해서 로그인·가입까지 같이 죽는다. 빈 값이면 도매를 부르는 화면만 못 쓴다 —
  # 실수했을 때 덜 무너지는 쪽으로 넘어진다.
  #
  # localhost 를 기본값으로 두지 않는 것도 의도다. 배포된 서버가 자기 자신을 부르며
  # 헤매면 원인을 찾는 데 훨씬 오래 걸린다.
  wholesale:
    base-url: ${WHOLESALE_BASE_URL:}

    # 소매 접점 시크릿 (MUL-87).
    #
    # 여기는 끝에 `:` 를 붙인다. 도매(기동 실패)와 반대다 — 소매가 시크릿을
    # 못 받으면 도매가 401 을 주고 상품·장바구니만 멈춘다. 로그인·가입은 산다.
    # 도매는 반대로 열려버리므로 기동을 실패시킨다.
    secret: ${ONDO_GATEWAY_SECRET:}
