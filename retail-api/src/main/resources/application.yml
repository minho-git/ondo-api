spring:
  application:
    name: retail-api
  profiles:
    default: local
  flyway:
    default-schema: retail    # 이력 테이블(flyway_schema_history)이 여기 생긴다
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 마이그레이션이 만든다. 엔티티와 어긋나면 앱이 안 뜬다
    open-in-view: false
    properties:
      hibernate:
        default_schema: retail
  session:
    jdbc:
      table-name: retail.spring_session
      initialize-schema: never   # 테이블은 Flyway 가 만든다. 스프링이 손대지 않는다

springdoc:
  swagger-ui:
    enabled: false   # 화면은 Scalar 를 쓴다(/docs). JSON 생성만 springdoc 이 한다

server:
  servlet:
    multipart:
      max-file-size: 10MB       # 명세상 사업자등록증 10MB. 스프링 기본값은 1MB 다
      max-request-size: 12MB    # 파일 + payload 를 합친 상한
    session:
      timeout: 2h               # 미정 상태다(숙제.md). 새벽 영업이라 짧으면 작업 중에 튕긴다
      cookie:
        name: SESSION_RETAIL    # 도매와 API 도메인을 같이 써서 이름이 같으면 서로 덮어쓴다
        http-only: true         # 자바스크립트가 못 읽는다. XSS 로 세션을 훔칠 수 없다
        same-site: lax
        secure: false           # 로컬은 http 다. 배포 프로필에서 true 로 덮는다
        path: /

# 헬스체크(MUL-76). ALB 가 30초마다 불러서 이 태스크에 트래픽을 보낼지 정한다
management:
  endpoints:
    web:
      exposure:
        include: health   # health 만 연다. 인터넷에 열리는 주소라 나머지는 닫아 둔다
  endpoint:
    health:
      # liveness · readiness 주소가 따로 생긴다.
      # ALB 는 liveness 를 보고, DB 상태는 health 로 본다.
      # ALB 에 DB 를 물리면 DB 장애 때 ECS 가 태스크를 죽이고 다시 띄우는데,
      # 새로 띄워도 DB 는 그대로라 재시작만 반복한다. 그걸 막으려고 가른다.
      probes:
        enabled: true
      show-details: never   # {"status":"UP"} 만 나간다. DB 종류·디스크 용량이 새지 않게
