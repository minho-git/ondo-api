# 배포용. 로컬(application-local.yml)과 달라지는 값만 여기 둔다.
#
# 비밀은 이 파일에 적지 않는다. ECS 태스크가 뜰 때 Secrets Manager 에서 받아
# 환경변수로 넣어주고, 스프링이 ${} 자리에 끼운다. 이미지에도 코드에도 값이 없다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true   # 배포는 https 다. 이걸 안 켜면 쿠키가 http 로도 나간다

# 소매 화면의 교차 출처 호출 허용 (MUL-85).
#
# 값을 환경변수로 뺀 건 환경이 둘이 되기 때문이다(MUL-77) — 지금 올리는 개발 환경과
# 나중에 만들 운영 환경이 허용할 주소가 다르다. 파일에 박아두면 같은 이미지를
# 두 환경에 못 쓴다. DB 주소를 뺀 것과 같은 이유다.
#
# 지금 넣을 값은 창은이 확인 대기다. Vercel 은 화면을 하나만 띄우고 환경변수로
# 어느 API 를 볼지 가르는 구조로 보인다 — 그러면 개발용 화면 주소가 따로 없다.
# 확실한 건 이 둘뿐이다.
#
#   https://ddmondo.co.kr   Vercel production 화면. 커스텀 도메인을 붙였다면
#   (localhost:3001)        로컬 화면은 여기 못 넣는다 — SameSite 가 막아서
#                           CORS 를 열어줘도 쿠키가 안 실린다. 로컬은 로컬 API 를 쓴다
#
# 여러 개면 쉼표로 잇는다.
#
# 끝의 `:` 는 "안 주면 빈 값" 이다. 안 붙이면 환경변수를 빠뜨렸을 때 앱이 기동조차
# 못 한다. 빈 값이면 허용 origin 이 없어 교차 출처가 전부 막힐 뿐이고,
# 헬스체크와 서버 간 호출은 그대로 된다 — 실수했을 때 닫히는 쪽으로 넘어진다.
ondo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # 도매 서버 주소 (MUL-88).
  #
  # ⚠ 아직 배포 환경에 값이 없다. 내부 ALB 와 서버 간 인증이 MUL-87 이라
  #   그게 붙기 전까지는 빈 값이고, 배포된 소매의 상품 4개와 장바구니는 500 이 난다.
  #   MUL-77 에서 내부 ALB 를 일부러 안 만든 것도 같은 이유다 — 부르는 코드가
  #   생길 때 같이 붙여야 「소매 → 내부 ALB → 도매」 구간이 실제로 검증된다.
  #
  # 끝의 `:` 는 CORS 와 같은 이유다. 안 붙이면 환경변수가 없을 때 앱이 기동조차
  # 못 해서 로그인·가입까지 같이 죽는다. 빈 값이면 도매를 부르는 화면만 못 쓴다 —
  # 실수했을 때 덜 무너지는 쪽으로 넘어진다.
  #
  # localhost 를 기본값으로 두지 않는 것도 의도다. 배포된 서버가 자기 자신을 부르며
  # 헤매면 원인을 찾는 데 훨씬 오래 걸린다.
  wholesale:
    base-url: ${WHOLESALE_BASE_URL:}
