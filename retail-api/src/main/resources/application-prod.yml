# 운영 환경 (MUL-104). 아직 안 띄웠다 — 지금 배포된 건 dev 다.
#
# 배포 공통은 application-deploy.yml 에 있다. 여기엔 개발 환경과 **달라지는 것**만 둔다.
# deploy 보다 뒤에 켜지므로 여기 적은 값이 이긴다 (MUL-103).

# API 문서를 닫는다 (MUL-103).
#
# 지금은 /docs 와 /v3/api-docs-retail 이 비로그인으로 열려 있다. 창은이가 로그인
# 전에 계약을 봐야 해서 그렇게 뒀다(MUL-81 · MUL-110).
#
# 운영에서는 그게 우리 API 전체 구조를 공개하는 것이다. 어떤 주소가 있고 무슨
# 값을 받는지가 다 나온다. 공격자가 제일 먼저 찾는 것이다.
#
# enabled: false 면 스펙 JSON 자체가 안 만들어진다 — 주소를 알아도 404 다.
# /docs 의 Scalar 화면은 정적 파일이라 그대로 뜨지만, 읽을 스펙이 없어 빈 껍데기다.
# SecurityConfig 를 프로필로 가르지 않은 건 그래서다 — 막을 것이 이미 없다.
#
# ⚠️ 운영 환경을 만들 때 ALB 리스너 규칙(infra/alb.tf 의 retail_docs)도 같이 빼라.
#    거기까지 지워야 요청이 앱에 닿지도 않는다.
springdoc:
  api-docs:
    enabled: false

server:
  servlet:
    session:
      cookie:
        # application.yml 기본값과 같은 값이다. 그래도 적는다.
        #
        # 개발 환경은 이걸 none 으로 푼다. 두 파일을 나란히 놓고 봤을 때 "운영은 안 풀었다"
        # 가 보여야 하는 값이라, 기본값에 기대지 않고 여기서 못 박는다.
        same-site: lax

# 시드는 여기 없다. locations 를 안 적으면 Flyway 기본값(db/migration)만 읽는다 —
# db/seed 의 개발 계정(V2·V3)과 가짜 상품·주문(V900·V901)이 운영에 안 들어간다.
# 그게 이 티켓의 목적이다. 없는 게 설정이다.
