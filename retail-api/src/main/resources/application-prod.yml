# 운영 환경 (MUL-104). 아직 안 띄웠다 — 지금 배포된 건 dev 다.
#
# 배포 공통은 application-deploy.yml 에 있다. 여기엔 개발 환경과 **달라지는 것**만 둔다.
#
# 지금은 쿠키 한 줄뿐이다. 늘어날 자리 —
#   · 문서(springdoc) 닫기 · 시드 계정 차단 (MUL-103)
#   · 로그 레벨
server:
  servlet:
    session:
      cookie:
        # application.yml 기본값과 같은 값이다. 그래도 적는다.
        #
        # 개발 환경은 이걸 none 으로 푼다. 두 파일을 나란히 놓고 봤을 때 "운영은 안 풀었다"
        # 가 보여야 하는 값이라, 기본값에 기대지 않고 여기서 못 박는다.
        same-site: lax
