# 운영 환경 (MUL-104). 아직 안 띄웠다 — 지금 배포된 건 dev 다.
#
# 배포 공통은 application-deploy.yml 에 있다. 여기엔 개발 환경과 **달라지는 것**만 둔다.
# deploy 보다 뒤에 켜지므로 여기 적은 값이 이긴다 (MUL-103).

# API 문서를 닫는다 (MUL-103). 소매와 같은 이유다 —
# 운영에서 /docs.html · /v3/api-docs 가 열려 있으면 API 전체 구조가 공개된다.
#
# enabled: false 면 스펙 JSON 이 안 만들어진다. 주소를 알아도 404 다.
#
# ⚠️ 운영 환경을 만들 때 ALB 리스너 규칙(infra/alb.tf 의 wholesale_docs)도 같이 빼라.
springdoc:
  api-docs:
    enabled: false

# 시드는 여기 없다. locations 를 안 적으면 Flyway 기본값(db/migration)만 읽는다 —
# db/seed 의 가짜 상품·주문(V900)과 로그인 계정(V901)이 운영에 안 들어간다.
# 없는 게 설정이다.
#
# 도매 쿠키는 소매와 달리 개발 환경에서도 안 풀었다. 도매 화면은 Vercel 에 있고
# 배포 API 를 부르는 게 이제부터라, 필요해지면 application-dev.yml 에 넣는다.
