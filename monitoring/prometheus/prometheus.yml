# 스크레이프 대상 (MUL-115). 소매는 MUL-117 에서 합류했다.

global:
  scrape_interval: 5s   # 부하 테스트 때 변화를 촘촘히 보려고 기본(1m)보다 짧게

scrape_configs:
  - job_name: wholesale-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: retail-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
